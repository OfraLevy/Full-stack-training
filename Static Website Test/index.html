<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="app">

        <header id="top-header">
            <img src="logo.png" alt="ChatGPT Logo" id="chat-logo">

            <nav id="main-nav">
                <ul id="nav-list">
                    <li><a href="index.html">Main</a></li>
                    <li><a href="images.html">Images</a></li>
                    <li><a href="#">Agent</a></li>
                </ul>
            </nav>

            <div id="header-buttons">
                <button id="login-button">Log in</button>
                <button id="signup-button">Sign up for Free</button>
                <button id="help-button">?</button>
            </div>
        </header>

        <main id="main-content">
            <h1 id="page-title">What's on the agenda today?</h1>

            <div id="chat-box">
                <textarea
                    id="user-input"
                    placeholder="Ask anything..."
                ></textarea>

                <div id="left-buttons">
                    <button id="attach-button" class="tool-button">Attach</button>
                    <button id="search-button" class="tool-button">Search</button>
                    <button id="study-button" class="tool-button">Study</button>
                    <button id="create-image-button" class="tool-button">Create Image</button>
                </div>

                <button id="voice-button">Voice</button>
            </div>
        </main>

    </div>
</body>
</html>
