<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="images.css">
</head>

<body>
    <div id="app">

        <header id="top-header">
            <img src="logo.png" alt="ChatGPT Logo" id="chat-logo">

            <!-- <nav id="main-nav">
                <ul id="nav-list">
                    <li><a href="#">Main</a></li>
                    <li><a href="#">Images</a></li>
                    <li><a href="#">Agent</a></li>
                </ul>
            </nav> -->

            <div id="header-buttons">
                <button id="login-button">Log in</button>
                <button id="signup-button">Sign up for Free</button>
                <button id="help-button">?</button>
            </div>
        </header>

        <main id="main-content">
            <h1 id="page-title">Images</h1>

            <div class="section-header">
                <h2 class="section-title">Try a style on an image</h2>
                <button class="prev-button">&lt;</button>
                <button class="next-button">&gt;</button>
            </div>

            <div id="image-style-container">
                <div class="image-style">
                    <img class="style-img" src="style1.jpg" alt="Sketch">
                    <span class="style-label">Sketch</span>
                </div>
                <div class="image-style">
                    <img class="style-img" src="style2.jpg" alt="Dramatic">
                    <span class="style-label">Dramatic</span>
                </div>
                <div class="image-style">
                    <img class="style-img" src="style3.jpg" alt="Plushie">
                    <span class="style-label">Plushie</span>
                </div>
                <div class="image-style">
                    <img class="style-img" src="style4.jpg" alt="Retro anime">
                    <span class="style-label">Retro anime</span>
                </div>
                <div class="image-style">
                    <img class="style-img" src="style5.jpg" alt="Baseball bobblehead">
                    <span class="style-label">Baseball bobblehead</span>
                </div>
                <div class="image-style">
                    <img class="style-img" src="style6.jpg" alt="Doodle">
                    <span class="style-label">Doodle</span>
                </div>
            </div>

            <div class="section-header">
                <h2 class="section-title">Discover something new</h2>
                <button class="prev-button">&lt;</button>
                <button class="next-button">&gt;</button>
            </div>

            <div id="small-style-container">
                <div class="small-image-style">
                    <img class="small-img" src="style1.jpg" alt="Me as The Girl with a Pearl">
                    <span class="small-label">Me as The Girl with a Pearl</span>
                </div>
                <div class="small-image-style">
                    <img class="small-img" src="style2.jpg" alt="Professional product photo">
                    <span class="small-label">Create a professional product photo</span>
                </div>
                <div class="small-image-style">
                    <img class="small-img" src="style3.jpg" alt="Remove people in the background">
                    <span class="small-label">Remove people in the background</span>
                </div>
                <div class="small-image-style">
                    <img class="small-img" src="style4.jpg" alt="Style me">
                    <span class="small-label">Style me</span>
                </div>
                <div class="small-image-style">
                    <img class="small-img" src="style5.jpg" alt="K-Pop star">
                    <span class="small-label">What would I look like as a K-Pop star?</span>
                </div>
                <div class="small-image-style">
                    <img class="small-img" src="style6.jpg" alt="Keychain">
                    <span class="small-label">Turn into a keychain</span>
                </div>
            </div>
        </main>


    </div>
</body>

</html>
